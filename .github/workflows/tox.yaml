name: Tox unit tests

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: The ref to build.
        required: true

# Concurrency is handled by the calling workflow. Defining a group here would
# deadlock, as github.workflow resolves to the caller's name in a reusable workflow.

jobs:
  build:
    name: Tox unit tests and linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']

    steps:
    - name: Check out the repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.ref || github.ref }}

    - name: Set up uv
      uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test with tox
      run: uv run --locked tox

    - name: Generate coverage reports
      run: uv run --locked tox -e cover

    - name: Archive code coverage results
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: "code-coverage-report-${{ matrix.python-version }}"
        path: cover/
