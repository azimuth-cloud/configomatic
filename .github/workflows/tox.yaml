name: Tox unit tests

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: The ref to build.
        required: true

# Concurrency is handled by the calling workflow. Defining a group here would
# deadlock, as github.workflow resolves to the caller's name in a reusable workflow.

jobs:
  build:
    name: Tox unit tests and linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']

    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test with tox
      run: uv run --locked tox

    - name: Generate coverage reports
      run: uv run --locked tox -e cover

    - name: Archive code coverage results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: "code-coverage-report-${{ matrix.python-version }}"
        path: cover/
